# ~/.config/tmux/tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Enable Mouse Support
set -g mouse on

# Increase History Limit
set -g history-limit 50000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Start Index at 1
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers gapless when one closes (pairs with base-index 1)
set -g renumber-windows on

# Killing a session jumps to the next one instead of detaching
set -g detach-on-destroy off

# True Color Support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Enable focus events for vim autoread
set -g focus-events on

# Let escape sequences from programs pass through (yazi image previews)
set -g allow-passthrough on

# ============================================
# KEY BINDINGS
# ============================================

# Change Prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session management — Tab/BTab replace the last-window/last-session
# defaults (l and L), which the vim-style pane bindings above shadow
bind Tab last-window
bind BTab switch-client -l
bind S command-prompt -p "new session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind f display-popup -E "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"

# Reload Binding
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#00e68a,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'

# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right

# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# OSC-52 fallback — clipboard via the terminal itself, works over SSH
set -s set-clipboard on

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux

# Mouse selections land on the same clipboard as y
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# ============================================
# PLUGINS (via TPM)
# ============================================
# Plugins clone to ~/.local/share/tmux/plugins (not the repo) to stay off the
# slow /mnt/c drvfs mount, mirroring the zsh plugin dir (see plugins.zsh)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

# Self-clone TPM on first launch, then install any missing plugins
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Seamless C-h/j/k/l between nvim splits and tmux panes (no prefix);
# nvim counterpart lives in dotfiles: nvim/lua/plugins/tmux-navigator.lua
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'
